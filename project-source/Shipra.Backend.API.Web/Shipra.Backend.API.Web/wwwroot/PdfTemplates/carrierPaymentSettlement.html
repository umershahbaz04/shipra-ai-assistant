<!DOCTYPE html>
<html>

<head>
    <link href="paper.css" rel="stylesheet" />
    <title>Return report</title>
    <style>
        * {
            padding: 0px !important;
            margin: 0px !important;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
        }
        table {
            table-layout: fixed;
        }
        table, td, th {
            width: 100%;
            border-collapse: collapse;
            border: 0px !important;
        }

            table.table-border {
                border: 1px solid #595959 !important;
            }

                table.table-border > tbody > tr > td, th {
                    border: 1px solid #595959 !important;
                    text-align: center; 
                }

        td, th {
            padding: 3px 5px;
            /*width: 60px;*/
            height: 25px;
        }
        .tablerow-container {
            width: 100%;
            height: 100%;
            display: table;
            text-align: center; 
        }

        .home-row {
            display: table-cell;
            vertical-align: middle;
        }
        .bold{
            font-weight:bold;
        }
        .text-1 {
            font-size: 25px;
            font-weight: 600;
            color: #bbbbbb;
            letter-spacing: 1px;
        }
    </style>
</head>
<body class="sheet" size="A4">
    <table>
        <tbody>
            <tr>
                <td>
                    <div class="w-50 text-1 text-right">
                        {{clientName}}
                    </div>
                    <!--<img class="p-5" width="150" height="50" src="{{companyLogo}}" />-->
                </td>
                <td class="bold">Carrier Settlement</td>
                <td class="tablerow-container">
                    <div class="home-row">
                        <div>
                            <img class="p-2"
                                 height="70"
                                 width="250"
                                 src="{{reportNoBarcode}}" />
                        </div>
                        <div class="bold">
                            {{reportNo}} 
                        </div>
                    </div> 
                </td>
            </tr>
        </tbody>
    </table>
    <table border="0">
        <tbody>
            <tr>
                <td><span class="bold">Ref No:<span></span> {{reportNo}}</td>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <td><span class="bold">Carrier Name:</span> {{carrierName}}</td>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <td><span class="bold">Generated date:</span> {{reportCreatedDate}}</td>
                <td></td>
                <td></td>
            </tr>
        </tbody>
    </table>
    <table class="table-border" style="margin:20px 0px !important">
        <tbody>
            <tr>
                <th>OrderNo </th>
                <th>Tracking No</th>
                <th>Store</th>
                <th>Desc</th>
                <th>Amount</th> 
            </tr>
            {{reportDatas}}
        </tbody>
    </table>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Run sheet</title>
    <style>
        * {
            padding: 0px !important;
            margin: 0px !important;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
        }

        .heading {
            font-weight: bold;
        }

        .w-25 {
            width: 25% !important;
        }

        .w-24 {
            width: 24% !important;
        }

        .p-5 {
            padding: 5% !important;
        }

        .w-32 {
            width: 32% !important;
        }

        .w-5 {
            width: 5% !important;
        }

        .w-10 {
            width: 10% !important;
        }

        .w-20 {
            width: 20% !important;
        }

        .w-30 {
            width: 30% !important;
        }

        .w-40 {
            width: 40% !important;
        }

        .w-50 {
            width: 50% !important;
        }

        .w-60 {
            width: 60% !important;
        }

        .w-70 {
            width: 70% !important;
        }

        .w-80 {
            width: 80% !important;
        }

        .w-90 {
            width: 90% !important;
        }

        .w-100 {
            width: 100% !important;
        }

        .bt {
            border-top: 2px solid black;
            padding-top: 5px !important;
            margin-top: 5px !important;
        }

        .br {
            border-right: 2px solid black;
            padding-right: 5px !important;
            margin-right: 5px !important;
        }

        .bb {
            border-bottom: 2px solid black;
            padding-bottom: 5px !important;
            margin-bottom: 5px !important;
        }

        .bl {
            border-left: 2px solid black;
            padding-left: 5px !important;
            margin-left: 5px !important;
        }

        table {
            border-collapse: collapse;
        }

            table > tbody > tr > th, td {
                text-align: center;
            }

        .tc {
            text-align: center !important;
        }

        .bgc {
            background-color: gray !important;
            color: black;
        }

        td, th {
            padding: 3px 5px;
            /*width: 60px;*/
            height: 20px;
            font-size: 11px !important;
        }

        .rote {
            display: inline-block;
            transform-origin: top right;
            transform: rotate(90deg) translate(-100%);
            margin-top: 50%;
            white-space: nowrap;
            width: 23px;
        }

        .talc {
            text-align: center !important;
        }

        .text-1 {
            font-size: 25px;
            font-weight: 600;
            color: #bbbbbb;
            letter-spacing: 1px;
        }

        .amount-heading {
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body style="font-size:11px !important;">
    <table class="w-100">
        <tr>
            <td>
                <table class="w-100">
                    <tr>
                        <td>
                            <table class="w-100">
                                <!--<td class="bb  talc" style="text-align: left !important;">-->
                                <!--<div class="w-50 text-1 text-right">
                                    {{clientName}}
                                </div>-->
                                <!--<img class="p-5" width="200" height="50" src="{{companyLogo}}">-->
                                <!--</td>-->
                                <td class="bb">
                                    <!--//style="text-align: left !important;width:60% "-->
                                    <div>
                                        <div>
                                            <span style="font-size: 14px; font-weight: bold;">Payout Orders</span>
                                        </div>
                                        <!--<br>-->
                                        <div style="text-align:center">
                                            <span style="font-size: 14px; font-weight: bold;">
                                                Dated: {{date}}
                                            </span>
                                        </div>
                                    </div>
                                </td>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <table class="w-100" style="font-size:11px !important;">
                            <tr class="bt bb">
                                <th class="bb w-5">Sr. No </th>
                                <th class="bb w-10">Order No.</th>
                                <th class="bb w-10">Customer Name</th>
                                <th class="bb w-10">Mobile</th>
                                <th class="bb w-10">Remarks</th>
                                <th class="bb w-10">Created On</th>
                                <th class="bb w-10">Amount</th>
                            </tr>
                            <tbody>
                                {{reportDatas}}
                            </tbody>
                        </table>
                    </tr>


                </table>
            </td>
        </tr>


    </table>

    <div style="text-align: right;margin-top:10px">
        <span class="amount-heading" style="display: block;">Total Amount: {{totalAmount}}</span>
        <span class="amount-heading" style="display: block;">Service Charges: {{serviceCharges}}</span>
        <span class="amount-heading" style="display: block;">Transaction Charges: {{transactionCharges}}</span>
        <span class="amount-heading" style="display: block;">Net total: {{netTotal}}</span>
    </div> 
</body>

</html>

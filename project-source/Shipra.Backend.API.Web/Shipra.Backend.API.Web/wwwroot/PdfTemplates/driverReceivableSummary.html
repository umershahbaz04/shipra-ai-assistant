<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Driver Receivable Summary</title>
    <style>
        * {
            padding: 0px !important;
            margin: 0px !important;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
        }

        .heading {
            font-weight: bold;
        }
        
        .w-20 { width: 20% !important; }
        .w-40 { width: 40% !important; }
        .w-60 { width: 60% !important; }
        .w-100 { width: 100% !important; }

        .bt {
            border-top: 2px solid black;
            padding-top: 5px !important;
            margin-top: 5px !important;
        }

        .bb {
            border-bottom: 2px solid black;
            padding-bottom: 5px !important;
            margin-bottom: 5px !important;
        }

        table {
            border-collapse: collapse;
        }

        table > tbody > tr > th, td {
            text-align: center;
        }

        td, th {
            padding: 3px 5px;
            height: 20px;
            font-size: 11px !important;
        }
        
        .talc {
            text-align: center !important;
        }

        .text-1 {
            font-size: 25px;
            font-weight: 600;
            color: #bbbbbb;
            letter-spacing: 1px;
        }
    </style>
</head>
<body style="font-size:11px !important;">
    <table class="w-100">
        <tr>
            <td>
                <table class="w-100">
                    <tr>
                        <td>
                            <table class="w-100">
                                <td class="bb talc" style="text-align: left !important;width:20%">
                                    <div class="text-1 text-right">
                                        {{clientName}}
                                    </div>
                                </td>
                                <td class="bb" style="text-align: center !important;width:60% ">
                                    <div>
                                        <span style="font-size: 14px; font-weight: bold;">Driver Receivable Summary</span>
                                        <br>
                                        <span style="font-size: 14px; font-weight: bold;">
                                            Dated: {{date}}
                                        </span>
                                        <br>
                                        <span style="font-size: 14px;">
                                            Driver: {{driverInfo}}
                                        </span>
                                    </div>
                                </td>
                                <td class="bb talc" style="text-align: left !important;width:20%">
                                    
                                </td>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <table class="w-100" style="font-size:11px !important;">
                            <tr class="bt bb">
                                <th class="bb">Ref #</th>
                                <th class="bb">Driver</th> 
                                <th class="bb">Status</th> 
                                <th class="bb">Receive Date</th> 
                                <th class="bb">Total Shipment</th> 
                                <th class="bb">Amount</th> 
                                <th class="bb">Expense</th>  
                                <th class="bb">Cash</th>
                                <th class="bb">Date</th> 
                            </tr>
                            <tbody>
                                {{reportDatas}}
                            </tbody>
                        </table>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
